# -------------------------------------------------------------------------------
# buf Generation
#
# Author: Alex Freidah
#
# Generates the agent and executor protocols' Go bindings beside the protos. The
# plugins run through `go tool`, so their versions are pinned by go.mod. The
# agent protocol is gRPC and the executor protocol ttRPC, so each service gets
# stubs from its own plugin only.
# -------------------------------------------------------------------------------

version: v2
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: .
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-go-grpc"]
    out: .
    opt: paths=source_relative
    exclude_types:
      - vagabond.agent.v1.Executor
  - local: ["go", "tool", "protoc-gen-go-ttrpc"]
    out: .
    opt: paths=source_relative
    types:
      - vagabond.agent.v1.Executor
inputs:
  - directory: .
    paths:
      - internal/agentrpc

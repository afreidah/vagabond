<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Vagabond architecture</title>
  <desc id="desc">The vagabond CLI calls the server's HTTP API. The server admits, ranks, dispatches and accounts for each task, keeps its records in Postgres or CockroachDB, and runs work on Google Cloud Run Jobs, Google Cloud Build, IBM Code Engine Jobs, AWS Lambda, OCI Functions, containerd on agent nodes, or Firecracker microVMs on agent nodes.</desc>
  <defs>
    <style>
      .t{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.label{font-size:21px;font-weight:700;fill:#f8fafc}.small{font-size:15px;font-weight:600;fill:#c9ccd3}.micro{font-size:14px;font-weight:700;fill:#ff8a2b;letter-spacing:.08em}.line{fill:none;stroke:#fd7300;stroke-width:3;stroke-linecap:round}.card{fill:#15171c;stroke:#fd7300;stroke-width:2}.core{fill:#3a1c05;stroke:#fd7300;stroke-width:3}.icon{fill:none;stroke:#ff8a2b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#fd7300"/></marker>
  </defs>
  <g class="t">
    <!-- Connections -->
    <path class="line" marker-end="url(#arrow)" d="M260 240H420"/>
    <text x="340" y="226" text-anchor="middle" class="small">HTTP /v1</text>
    <path class="line" d="M780 240H830M830 54V510"/>
    <path class="line" marker-end="url(#arrow)" d="M830 54H880"/>
    <path class="line" marker-end="url(#arrow)" d="M830 130H880"/>
    <path class="line" marker-end="url(#arrow)" d="M830 206H880"/>
    <path class="line" marker-end="url(#arrow)" d="M830 282H880"/>
    <path class="line" marker-end="url(#arrow)" d="M830 358H880"/>
    <path class="line" marker-end="url(#arrow)" d="M830 434H880"/>
    <path class="line" marker-end="url(#arrow)" d="M830 510H880"/>
    <path class="line" marker-end="url(#arrow)" d="M600 390V440"/>

    <!-- CLI -->
    <rect x="40" y="160" width="220" height="160" rx="26" class="card"/>
    <g class="icon"><rect x="120" y="186" width="60" height="44" rx="7"/><path d="M132 200l10 8-10 8M150 218h16"/></g>
    <text x="150" y="268" text-anchor="middle" class="label">vagabond CLI</text>
    <text x="150" y="294" text-anchor="middle" class="small">plan, run, dispatch</text>

    <!-- Server -->
    <rect x="420" y="90" width="360" height="300" rx="36" class="core"/>
    <path class="icon" style="stroke:#f8fafc" d="M600 116l26 15v30l-26 15-26-15v-30z"/>
    <text x="600" y="214" text-anchor="middle" class="label" style="font-size:27px">vagabond server</text>
    <text x="600" y="244" text-anchor="middle" class="micro">CONTROL PLANE</text>
    <g class="small" text-anchor="middle" style="fill:#f8fafc">
      <text x="520" y="298">admission</text><text x="680" y="298">ranking</text>
      <text x="520" y="336">dispatch</text><text x="680" y="336">quotas</text>
    </g>

    <!-- Store -->
    <rect x="440" y="440" width="320" height="96" rx="24" class="card"/>
    <g class="icon"><ellipse cx="496" cy="468" rx="22" ry="8"/><path d="M474 468v38c0 4 10 8 22 8s22-4 22-8v-38M474 487c0 4 10 8 22 8s22-4 22-8"/></g>
    <text x="540" y="482" class="label">Store</text>
    <text x="540" y="508" class="small">Postgres / CockroachDB</text>

    <!-- Execution options, one card each -->
    <rect x="880" y="22" width="300" height="64" rx="18" class="card"/>
    <rect x="880" y="98" width="300" height="64" rx="18" class="card"/>
    <rect x="880" y="174" width="300" height="64" rx="18" class="card"/>
    <rect x="880" y="250" width="300" height="64" rx="18" class="card"/>
    <rect x="880" y="326" width="300" height="64" rx="18" class="card"/>
    <rect x="880" y="402" width="300" height="64" rx="18" class="card"/>
    <rect x="880" y="478" width="300" height="64" rx="18" class="card"/>
    <g class="icon">
      <path transform="translate(-12,-36)" d="M922 104h36a12 12 0 0 0 0-24 17 17 0 0 0-32-3 13 13 0 0 0-4 27z"/>
      <path transform="translate(-12,40)" d="M922 104h36a12 12 0 0 0 0-24 17 17 0 0 0-32-3 13 13 0 0 0-4 27z"/>
      <path transform="translate(-12,116)" d="M922 104h36a12 12 0 0 0 0-24 17 17 0 0 0-32-3 13 13 0 0 0-4 27z"/>
      <path d="M932 266L918 284H930L924 298L940 278H928Z"/>
      <path d="M932 342L918 360H930L924 374L940 354H928Z"/>
      <g transform="translate(-12,44)"><rect x="918" y="370" width="44" height="16" rx="4"/><rect x="918" y="394" width="44" height="16" rx="4"/><path d="M926 378h2M926 402h2"/></g>
      <g transform="translate(-12,120)"><rect x="918" y="370" width="44" height="16" rx="4"/><rect x="918" y="394" width="44" height="16" rx="4"/><path d="M926 378h2M926 402h2"/></g>
    </g>
    <text x="968" y="49" class="label">Cloud Run</text><text x="968" y="71" class="small">Google Cloud jobs</text>
    <text x="968" y="125" class="label">Cloud Build</text><text x="968" y="147" class="small">Google Cloud builds</text>
    <text x="968" y="201" class="label">Code Engine</text><text x="968" y="223" class="small">IBM Cloud jobs</text>
    <text x="968" y="277" class="label">AWS Lambda</text><text x="968" y="299" class="small">functions</text>
    <text x="968" y="353" class="label">OCI Functions</text><text x="968" y="375" class="small">Oracle Cloud functions</text>
    <text x="968" y="429" class="label">containerd</text><text x="968" y="451" class="small">agent nodes, containers</text>
    <text x="968" y="505" class="label">Firecracker</text><text x="968" y="527" class="small">agent nodes, microVMs</text>
  </g>
</svg>

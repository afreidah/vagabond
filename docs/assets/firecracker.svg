<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">vagabond-firecracker on a node</title>
  <desc id="desc">The agent pulls each image through containerd into a devmapper snapshot and resolves its process and user, then calls vagabond-firecracker over the executor protocol, ttRPC on a socket only root can open. The daemon gives each workload a jail, a cgroup, and a tap behind NAT, and starts Firecracker through the jailer, its memory limited to what the workload declared plus Firecracker's overhead. The microVM boots into vagabond-init, which mounts the snapshot as its root drive, runs the workload as the image's user, and talks to the daemon over vsock.</desc>
  <defs>
    <style>
      .t{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.label{font-size:20px;font-weight:700;fill:#f8fafc}.small{font-size:14px;font-weight:600;fill:#c9ccd3}.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:13px;fill:#c9ccd3}.micro{font-size:13px;font-weight:700;fill:#ff8a2b;letter-spacing:.08em}.line{fill:none;stroke:#fd7300;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.card{fill:#15171c;stroke:#fd7300;stroke-width:2}.core{fill:#3a1c05;stroke:#fd7300;stroke-width:3}.frame{fill:none;stroke:#9a9ea6;stroke-width:2;stroke-dasharray:7 6}.box{fill:#0d0e12;stroke:#9a9ea6;stroke-width:1.5}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#fd7300"/></marker>
  </defs>
  <g class="t">
    <!-- Node -->
    <rect x="20" y="20" width="1160" height="480" rx="30" class="frame"/>
    <text x="50" y="52" class="micro">NODE · KVM</text>

    <!-- Agent -->
    <rect x="50" y="80" width="270" height="130" rx="20" class="card"/>
    <text x="76" y="116" class="label">vagabond agent</text>
    <text x="76" y="144" class="small">pulls each image into a</text>
    <text x="76" y="166" class="small">devmapper snapshot, and</text>
    <text x="76" y="188" class="small">resolves its process</text>

    <!-- containerd -->
    <path class="line" marker-end="url(#arrow)" d="M185 210V282"/>
    <text x="197" y="252" class="small" style="fill:#9a9ea6">pull · snapshot</text>
    <rect x="50" y="290" width="270" height="96" rx="20" class="card"/>
    <text x="76" y="326" class="label">containerd</text>
    <text x="76" y="352" class="small">devmapper thin pool,</text>
    <text x="76" y="374" class="small">a snapshot per workload</text>

    <!-- Executor protocol -->
    <path class="line" marker-end="url(#arrow)" d="M320 145H490"/>
    <text x="405" y="132" text-anchor="middle" class="mono">executor protocol</text>
    <text x="405" y="168" text-anchor="middle" class="small" style="fill:#9a9ea6">ttRPC · root only</text>

    <!-- Daemon -->
    <rect x="498" y="80" width="310" height="150" rx="30" class="core"/>
    <text x="653" y="124" text-anchor="middle" class="label" style="font-size:22px">vagabond-firecracker</text>
    <text x="653" y="150" text-anchor="middle" class="micro">A MICROVM PER WORKLOAD</text>
    <g class="small" text-anchor="middle" style="fill:#f8fafc">
      <text x="653" y="184">jail · cgroup · tap · NAT</text>
      <text x="653" y="208">records outlive it</text>
    </g>

    <!-- Jailer -->
    <path class="line" marker-end="url(#arrow)" d="M808 155H858"/>
    <text x="834" y="138" text-anchor="middle" class="mono">jailer</text>

    <!-- MicroVM -->
    <rect x="866" y="70" width="294" height="370" rx="26" class="frame" style="stroke:#fd7300"/>
    <text x="888" y="100" class="micro">MICROVM · JAIL · CGROUP</text>

    <rect x="880" y="118" width="264" height="78" rx="16" class="card"/>
    <text x="900" y="150" class="label">Firecracker</text>
    <text x="900" y="176" class="small">declared memory + overhead</text>

    <rect x="880" y="214" width="264" height="78" rx="16" class="card"/>
    <text x="900" y="246" class="label">vagabond-init</text>
    <text x="900" y="272" class="small">PID 1 · vsock port 1024</text>

    <rect x="880" y="310" width="264" height="56" rx="10" class="box"/>
    <text x="1012" y="343" text-anchor="middle" class="mono">workload, as the image's user</text>

    <!-- Root drive -->
    <path class="line" marker-end="url(#arrow)" d="M320 338H858"/>
    <text x="589" y="326" text-anchor="middle" class="mono">root drive</text>
    <text x="589" y="362" text-anchor="middle" class="small" style="fill:#9a9ea6">the snapshot's block device, /dev/vda</text>

    <!-- Network -->
    <path class="line" marker-end="url(#arrow)" d="M866 428H816"/>
    <rect x="498" y="398" width="310" height="72" rx="16" class="card"/>
    <text x="524" y="430" class="label">tap · NAT</text>
    <text x="524" y="456" class="small">out through --uplink</text>
  </g>
</svg>

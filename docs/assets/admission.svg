<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Admission</title>
  <desc id="desc">Every provider is checked in four tiers: policy, availability, mismatch and capacity. A provider that fails a check is rejected with that check's reason code. The providers that pass every check are the candidates, which ranking scores to select one.</desc>
  <defs>
    <style>
      .t{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.label{font-size:19px;font-weight:700;fill:#f8fafc}.small{font-size:14px;font-weight:600;fill:#c9ccd3}.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:13px;fill:#c9ccd3}.micro{font-size:13px;font-weight:700;fill:#ff8a2b;letter-spacing:.08em}.line{fill:none;stroke:#fd7300;stroke-width:3;stroke-linecap:round}.dash{fill:none;stroke:#9a9ea6;stroke-width:2.5;stroke-dasharray:7 6;stroke-linecap:round}.card{fill:#15171c;stroke:#fd7300;stroke-width:2}.core{fill:#3a1c05;stroke:#fd7300;stroke-width:3}.muted{fill:#15171c;stroke:#9a9ea6;stroke-width:2;stroke-dasharray:7 6}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#fd7300"/></marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#9a9ea6"/></marker>
  </defs>
  <g class="t">
    <!-- Flow -->
    <path class="line" marker-end="url(#arrow)" d="M190 200H230"/>
    <path class="line" marker-end="url(#arrow)" d="M390 200H420"/>
    <path class="line" marker-end="url(#arrow)" d="M580 200H610"/>
    <path class="line" marker-end="url(#arrow)" d="M770 200H800"/>
    <path class="line" marker-end="url(#arrow)" d="M960 200H1000"/>

    <!-- Rejections -->
    <path class="dash" marker-end="url(#arrow-grey)" d="M310 330V410"/>
    <path class="dash" marker-end="url(#arrow-grey)" d="M500 330V410"/>
    <path class="dash" marker-end="url(#arrow-grey)" d="M690 330V410"/>
    <path class="dash" marker-end="url(#arrow-grey)" d="M880 330V410"/>

    <!-- Providers -->
    <rect x="30" y="70" width="160" height="260" rx="22" class="card"/>
    <text x="110" y="104" text-anchor="middle" class="micro">PROVIDERS</text>
    <g class="mono" text-anchor="middle">
      <text x="110" y="148">gcp-cloud-run</text><text x="110" y="178">gcp-eu</text><text x="110" y="208">aws-lambda</text><text x="110" y="238">homelab</text><text x="110" y="268">paid-fargate</text>
    </g>
    <text x="110" y="306" text-anchor="middle" class="small">every one checked</text>

    <!-- Tiers -->
    <rect x="230" y="70" width="160" height="260" rx="22" class="card"/>
    <rect x="420" y="70" width="160" height="260" rx="22" class="card"/>
    <rect x="610" y="70" width="160" height="260" rx="22" class="card"/>
    <rect x="800" y="70" width="160" height="260" rx="22" class="card"/>
    <g text-anchor="middle">
      <text x="310" y="104" class="micro">1 · POLICY</text>
      <g class="small"><text x="310" y="148">allowlist</text><text x="310" y="172">cost</text></g>
      <text x="500" y="104" class="micro">2 · AVAILABILITY</text>
      <g class="small"><text x="500" y="148">enabled</text><text x="500" y="172">healthy</text></g>
      <text x="690" y="104" class="micro">3 · MISMATCH</text>
      <g class="small"><text x="690" y="138">driver</text><text x="690" y="160">arch</text><text x="690" y="182">image</text><text x="690" y="204">network</text><text x="690" y="226">resources</text><text x="690" y="248">duration</text><text x="690" y="270">attribute</text><text x="690" y="292">constraint</text></g>
      <text x="880" y="104" class="micro">4 · CAPACITY</text>
      <g class="small"><text x="880" y="148">quota</text></g>
    </g>

    <!-- Candidates -->
    <rect x="1000" y="120" width="170" height="160" rx="26" class="core"/>
    <text x="1085" y="158" text-anchor="middle" class="micro">CANDIDATES</text>
    <text x="1085" y="198" text-anchor="middle" class="label">Ranking</text>
    <text x="1085" y="226" text-anchor="middle" class="small" style="fill:#f8fafc">scored in [0, 1]</text>
    <text x="1085" y="250" text-anchor="middle" class="small" style="fill:#f8fafc">one selected</text>

    <!-- Rejection band -->
    <rect x="230" y="410" width="730" height="84" rx="22" class="muted"/>
    <text x="595" y="444" text-anchor="middle" class="label" style="fill:#c9ccd3">Rejected, with a reason code and detail</text>
    <text x="595" y="470" text-anchor="middle" class="mono">not-allowlisted · provider-unhealthy · driver-unsupported · quota-exhausted …</text>
  </g>
</svg>

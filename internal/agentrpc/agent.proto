// -----------------------------------------------------------------------------
// Agent Protocol
//
// Author: Alex Freidah
//
// What a server and its agents say to each other. The agent dials the server
// and both sides run gRPC over streams of that one multiplexed connection:
// Node is served by the server and called by the agent, AgentExecutions is
// served by the agent and called by the server.
// -----------------------------------------------------------------------------

syntax = "proto3";

package vagabond.agent.v1;

option go_package = "github.com/afreidah/vagabond/internal/agentrpc";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// -----------------------------------------------------------------------------
// NODE: agent to server
// -----------------------------------------------------------------------------

service Node {
  // Register announces the node when the agent connects, and again whenever
  // what it reports changes.
  rpc Register(NodeRegisterRequest) returns (NodeRegisterResponse);
}

// NodeRegisterRequest is one agent's node as it reports itself, sent when it
// connects and again whenever its workloads change. capacity is the smallest
// of the host's resources, the agent's cgroup limits, and its flags. held is
// every workload it still holds, so a server knows what is placed where and
// how much of the node is in use, after either side restarts.
message NodeRegisterRequest {
  string name = 1;
  string pool = 2;
  map<string, string> labels = 3;
  string architecture = 4;
  Resources capacity = 5;
  repeated string runtimes = 6;
  string version = 7;
  repeated Held held = 8;
}

// Held is one workload on a node: what it declared, and whether it is still
// running and so still using that much of the node.
message Held {
  string execution_id = 1;
  Resources resources = 2;
  bool running = 3;
}

// Resources are millicores and MiB, matching job.Resources.
message Resources {
  int64 cpu = 1;
  int64 memory = 2;
}

message NodeRegisterResponse {}

// -----------------------------------------------------------------------------
// AGENT EXECUTIONS: server to agent
// -----------------------------------------------------------------------------

service AgentExecutions {
  rpc Submit(SubmitRequest) returns (Submission);
  rpc Status(ExecutionRequest) returns (ExecutionStatus);
  rpc Result(ExecutionRequest) returns (ExecutionResult);
  rpc Cancel(ExecutionRequest) returns (Empty);
  rpc Release(ExecutionRequest) returns (Empty);
  rpc StreamLogs(ExecutionRequest) returns (stream LogChunk);
}

// Workload is a task already translated to what a container needs: the server
// decodes the job, the agent only runs it.
message Workload {
  string image = 1;
  repeated string command = 2;
  repeated string args = 3;
  map<string, string> env = 4;
  string working_dir = 5;
  Resources resources = 6;
  google.protobuf.Duration timeout = 7;
  string runtime = 8;
}

message SubmitRequest {
  string execution_id = 1;
  Workload workload = 2;
}

// Submission and ExecutionStatus carry execution states by their names in
// internal/execution.
message Submission {
  string state = 1;
  string provider_id = 2;
}

message ExecutionRequest {
  string execution_id = 1;
}

message ExecutionStatus {
  string state = 1;
  string provider_id = 2;
  google.protobuf.Timestamp started_at = 3;
  google.protobuf.Timestamp ended_at = 4;
}

// ExecutionResult's exit_code is unset when the workload never exited, and
// logs are the stored tail.
message ExecutionResult {
  optional int32 exit_code = 1;
  google.protobuf.Duration duration = 2;
  bytes logs = 3;
  bool logs_truncated = 4;
}

message LogChunk {
  bytes data = 1;
}

message Empty {}

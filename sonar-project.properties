# -------------------------------------------------------------------------------
# SonarCloud Analysis
#
# Author: Alex Freidah
#
# Read by the sonarqube job in CI. Coverage is the unit and integration profiles
# combined: each is written with -coverpkg=./..., so a line either suite runs
# counts as covered. Generated code and non-Go content are left out of analysis;
# code only tests use is left out of coverage.
# -------------------------------------------------------------------------------

sonar.projectKey=afreidah_vagabond
sonar.organization=afreidah

sonar.go.coverage.reportPaths=coverage.out,integration-coverage.out

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.sourceEncoding=UTF-8

# Tests, generated code (sqlc, protobuf) and everything that is not Go source.
sonar.exclusions=**/*_test.go,internal/state/postgres/sqlc/**,internal/agentrpc/*.pb.go,web/**,docs/**,examples/**,**/*.sql

# main only calls cli.Run; pgtest and the capability fixtures exist for tests.
sonar.coverage.exclusions=cmd/**,internal/state/postgres/pgtest/**,internal/plugin/testing.go

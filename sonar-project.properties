# -------------------------------------------------------------------------------
# SonarCloud Analysis
#
# Author: Alex Freidah
#
# Read by the sonarqube job in CI. Go coverage is the unit, integration and
# containerd profiles combined: each is written with -coverpkg=./..., so a line
# any suite runs counts as covered. Rust coverage is vagabond-firecracker's unit
# and microVM LCOV reports, combined the same way. Generated code and content
# that is neither Go nor Rust are left out of analysis; code only tests use is
# left out of coverage.
# -------------------------------------------------------------------------------

sonar.projectKey=afreidah_vagabond
sonar.organization=afreidah

sonar.go.coverage.reportPaths=coverage.out,integration-coverage.out,containerd-coverage.out
sonar.rust.lcov.reportPaths=rust-coverage.lcov,firecracker-coverage.lcov

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,rust/*/tests/**
sonar.sourceEncoding=UTF-8

# Tests, generated code (sqlc, protobuf) and everything that is not Go or Rust
# source.
sonar.exclusions=**/*_test.go,rust/*/tests/**,internal/state/postgres/sqlc/**,internal/agentrpc/*.pb.go,web/**,docs/**,examples/**,**/*.sql

# main only calls cli.Run; pgtest, the store contracts and the capability
# fixtures exist for tests.
sonar.coverage.exclusions=cmd/**,internal/state/postgres/pgtest/**,internal/state/statetest/**,internal/agent/executor/executortest/**,internal/plugin/testing.go

# -------------------------------------------------------------------------------
# Dispatch the static-analysis job to Vagabond for every pushed branch.
#
# Author: Alex Freidah
#
# The job itself is registered from munchbox, so this only names it. It lives
# here rather than in .github/workflows because GitHub-hosted runners cannot
# reach the server, and it does not gate merges: GitHub CI stays the required
# check.
#
# main is left out because a merge redeploys the server, and job dispatch exits
# on the first status poll that fails. Dependabot branches are left out because
# GitHub CI checks them and each run spends free-tier quota.
# -------------------------------------------------------------------------------

name: Static analysis

on:
  push:
    branches-ignore: [main, 'dependabot/**']

jobs:
  static-analysis:
    name: Dispatch to Vagabond
    runs-on: build
    steps:
      - name: Run the static-analysis job
        run: |
          set -euo pipefail

          docker run --rm --pull always \
            -e VAGABOND_ADDR=http://vagabond.service.consul:4747 \
            registry.munchbox.cc/vagabond:latest \
            job dispatch \
              -meta repo=afreidah/vagabond \
              -meta commit=${{ github.sha }} \
              -meta targets="vet lint fmt-check govulncheck" \
              static-analysis

# -------------------------------------------------------------------------------
# Dispatch the static-analysis job to Vagabond for every pushed branch.
#
# Author: Alex Freidah
#
# The job itself is registered from munchbox, so this only names it. It lives
# here rather than in .github/workflows because GitHub-hosted runners cannot
# reach the server, and it does not gate merges: GitHub CI stays the required
# check.
#
# main is left out because a merge redeploys the server, which can outlast the
# two minutes job dispatch rides out an unreachable server for. Dependabot
# branches are left out because GitHub CI checks them and each run spends
# free-tier quota.
#
# The API token comes from the VAGABOND_TOKEN secret, passed through the
# environment so it stays off the command line. Without the secret no token is
# sent, which only a server declaring no tokens accepts.
# -------------------------------------------------------------------------------

name: Static analysis

on:
  push:
    branches-ignore: [main, 'dependabot/**']

jobs:
  static-analysis:
    name: Dispatch to Vagabond
    runs-on: build
    steps:
      - name: Run the static-analysis job
        env:
          VAGABOND_TOKEN: ${{ secrets.VAGABOND_TOKEN }}
        run: |
          set -euo pipefail

          docker run --rm --pull always \
            -e VAGABOND_ADDR=http://vagabond.service.consul:4747 \
            -e VAGABOND_TOKEN \
            registry.munchbox.cc/vagabond:latest \
            job dispatch \
              -meta repo=afreidah/vagabond \
              -meta commit=${{ github.sha }} \
              -meta targets="vet lint fmt-check govulncheck" \
              static-analysis

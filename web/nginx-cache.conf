# -------------------------------------------------------------------------------
# Static Asset Caching and Compression
#
# Author: Alex Freidah
#
# Included from the http context by the stock nginx.conf. Hugo fingerprints
# CSS and JS, so those cache for a year; images are not fingerprinted and get
# 30 days; HTML always revalidates so a redeploy is seen at once.
# -------------------------------------------------------------------------------

map $sent_http_content_type $asset_expires {
    default                   off;
    text/html                 epoch;
    text/css                  1y;
    text/javascript           1y;
    application/javascript    1y;
    application/json          1h;
    ~image/                   30d;
    ~font/                    1y;
}

expires $asset_expires;

# Missing pages get the site's 404 page with a real 404 status, so crawlers
# drop them instead of indexing a soft 404.
error_page 404 /404.html;

add_header Cross-Origin-Opener-Policy same-origin always;

gzip              on;
gzip_vary         on;
gzip_min_length   1024;
gzip_comp_level   6;
gzip_proxied      any;
gzip_types
    text/plain
    text/css
    text/javascript
    text/xml
    application/javascript
    application/json
    application/xml
    image/svg+xml;

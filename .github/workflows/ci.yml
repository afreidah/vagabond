# -------------------------------------------------------------------------------
# CI Workflow - GitHub Actions
#
# Author: Alex Freidah
#
# Runs on push to main and on pull requests. Formatting, vet, lint, and tests
# are the same gates `make check` runs locally, plus the integration suite, the
# microVM tests and both executors' tests, so a change that passes
# locally passes here. Tool versions are pinned to match the Makefile; a
# mismatch would mean local and CI results disagree.
# -------------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOLANGCI_VERSION: v2.14.0
  CARGO_AUDIT_VERSION: 0.23.0
  CARGO_LLVM_COV_VERSION: 0.9.1

jobs:
  # ---------------------------------------------------------------------------
  # VERSION
  # ---------------------------------------------------------------------------
  # Images are tagged from .version, so a change that reaches an image without
  # a bump would republish under a tag that already means something else.
  version-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Check for changes that reach an image
        id: changes
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep -qE '\.(go|sql|proto)$|^go\.(mod|sum)$|^sqlc\.yaml$|^web/|^rust/|Dockerfile$'; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify version bump
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          BASE_VERSION=$(git show origin/${{ github.base_ref }}:.version 2>/dev/null || echo none)
          PR_VERSION=$(cat .version)
          if [ "$BASE_VERSION" = "$PR_VERSION" ]; then
            echo "::error::.version must be incremented when Go, SQL or site files change (current: $PR_VERSION)"
            exit 1
          fi
          echo "Version bumped: $BASE_VERSION -> $PR_VERSION"

  # ---------------------------------------------------------------------------
  # FORMATTING AND STATIC ANALYSIS
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod

      # install-only, then the Make targets below. Letting the action run the
      # linter would mean CI and `make lint` could drift apart, and the action
      # prepends `run` to its args, which the fmt subcommand is not.
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ env.GOLANGCI_VERSION }}
          install-only: true

      - name: Vet
        run: make vet

      - name: Lint
        run: make lint

      - name: Format check
        run: make fmt-check

  # ---------------------------------------------------------------------------
  # TESTS
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod

      - name: Test
        run: make coverage

      - name: Upload unit coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unit-coverage
          path: coverage.out

  # ---------------------------------------------------------------------------
  # INTEGRATION TESTS
  #
  # The store suite against Postgres and CockroachDB, and the server end to end.
  # testcontainers drives the runner's Docker, so nothing is started by hand.
  # ---------------------------------------------------------------------------
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod

      - name: Integration test
        run: make integration-coverage

      - name: Upload integration coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: integration-coverage
          path: integration-coverage.out

  # ---------------------------------------------------------------------------
  # RUST
  #
  # vagabond-firecracker's gates. rustup on the runner installs the toolchain
  # rust-toolchain.toml pins on first use, and the tools come prebuilt.
  # ---------------------------------------------------------------------------
  rust-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-audit@${{ env.CARGO_AUDIT_VERSION }}

      - name: Format check
        run: make rust-fmt-check

      - name: Lint
        run: make rust-lint

      - name: Audit
        run: make rust-audit

  rust-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-llvm-cov@${{ env.CARGO_LLVM_COV_VERSION }}

      - name: Test
        run: make rust-coverage

      - name: Upload Rust coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rust-coverage
          path: rust-coverage.lcov

  # ---------------------------------------------------------------------------
  # FIRECRACKER AND THE EXECUTORS
  #
  # The microVM tests, then the agent's two executors against a containerd and
  # a vagabond-firecracker of their own, on the runner's KVM, which GitHub's
  # Linux runners expose though nested virtualization is not officially
  # supported. They need root, so they are built as the runner user and run
  # with sudo, as `make firecracker-coverage` and `make executor-coverage` do
  # locally. Docker on the runner supplies containerd and runc.
  # ---------------------------------------------------------------------------
  firecracker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-llvm-cov@${{ env.CARGO_LLVM_COV_VERSION }}

      # Without KVM every test fails at boot; this says why up front.
      - name: Check KVM
        run: test -c /dev/kvm

      - name: Install the initramfs, root drive, thin pool and firewall tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cpio dmsetup e2fsprogs nftables

      - name: Firecracker test
        run: make firecracker-coverage

      - name: Executor test
        run: make executor-coverage

      - name: Upload Firecracker coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: firecracker-coverage
          path: firecracker-coverage.lcov

      - name: Upload executor coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: executor-coverage
          path: executor-coverage.out

  # ---------------------------------------------------------------------------
  # VULNERABILITY SCANNING
  #
  # govulncheck is pinned by the tool directive in go.mod, so this runs the
  # same version a developer gets from `make govulncheck`.
  # ---------------------------------------------------------------------------
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod

      - name: Run govulncheck
        run: go tool govulncheck ./...

  # ---------------------------------------------------------------------------
  # GENERATED CODE
  #
  # Catches a mock that was not regenerated after its interface changed, which
  # otherwise surfaces as a confusing compile failure in a later PR.
  # ---------------------------------------------------------------------------
  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod

      - name: Verify generated code is current
        run: make generate-check

  # ---------------------------------------------------------------------------
  # SONARCLOUD
  #
  # Combines the Go unit, integration and executor coverage and the Rust unit
  # and microVM coverage the test jobs uploaded. Runs on every pull request and
  # every push to main, so main is re-analysed with fresh coverage. A test job
  # that failed uploaded no profile, and scanning without it would report a
  # drop that is really a missing file, so the scan is skipped then.
  # ---------------------------------------------------------------------------
  sonarqube:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, integration, rust-test, firecracker]
    if: >-
      always()
      && github.actor != 'dependabot[bot]'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      # Every coverage artifact into the checkout, each file under its own name.
      - name: Download coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: '*-coverage'
          merge-multiple: true
        continue-on-error: true

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
